[project]
name = "saloncutai"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.14.0",
    "diffusers==0.39.0",
    "fastapi>=0.141.1",
    "huggingface-hub==1.26.0",
    "insightface>=0.7.3",
    "mediapipe>=0.10.14",
    "numpy==2.0.2",
    "onnxruntime>=1.20.0",
    "openai==2.53.0",
    "opencv-python-headless~=4.13.0",
    "peft==0.19.1",
    "pillow==12.2.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.20",
    "ruff>=0.16.1",
    "safetensors==0.8.0",
    "sqlalchemy>=2.0.51",
    "torch==2.11.0",
    "transformers==5.14.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest-asyncio>=1.4.0",
    "scikit-image>=0.25.0",
]

[tool.ruff.lint.flake8-bugbear]
# B008 경고에서 fastapi의 Depends 구문은 예외로 처리합니다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
