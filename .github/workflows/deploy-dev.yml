name: dev 검증 및 VM 자동 배포

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/scripts/deploy-dev.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saloncutai-dev-vm
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: sprint-ai-chunk2-01
  GCP_ZONE: us-central1-c
  GCP_INSTANCE: salon-ai-1

jobs:
  frontend-check:
    name: 프론트엔드 검사
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 22 설정
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 린트
        working-directory: frontend
        run: npm run lint

      - name: 프로덕션 빌드
        working-directory: frontend
        env:
          NEXT_PUBLIC_PUBLIC_PREVIEW: "1"
        run: npm run build

  backend-check:
    name: 백엔드 문법 검사
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.12 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python 소스 컴파일 검사
        run: python -m compileall -q backend/src

  deploy:
    name: GCP VM 반영
    needs:
      - frontend-check
      - backend-check
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: GCP 단기 인증
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: gcloud 설정
        uses: google-github-actions/setup-gcloud@v3

      - name: 배포 스크립트 전송
        run: |
          gcloud compute scp .github/scripts/deploy-dev.sh \
            "${GCP_INSTANCE}:/tmp/saloncutai-deploy-dev.sh" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --ssh-key-expire-after=10m

      - name: dev 커밋 VM 반영
        run: |
          gcloud compute ssh "${GCP_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --quiet \
            --ssh-key-expire-after=10m \
            --command="chmod 700 /tmp/saloncutai-deploy-dev.sh && /tmp/saloncutai-deploy-dev.sh '${GITHUB_SHA}'"

